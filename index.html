<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業完了登録</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; padding: 16px;
           background: #f0f4f8; margin: 0; }
    h1 { font-size: 1.3rem; color: #333; text-align: center; margin-bottom: 16px; }
    .card { background: white; border-radius: 12px;
            padding: 16px; margin: 10px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    label { font-size: 0.85rem; color: #666; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; font-size: 1rem;
            border-radius: 8px; border: 1px solid #ccc; margin-bottom: 4px; }
    button { width: 100%; padding: 14px; margin: 6px 0;
             font-size: 1rem; border-radius: 8px;
             border: none; cursor: pointer; color: white; }
    .btn-qr  { background: #1a73e8; }
    .btn-cam { background: #f57c00; }
    .btn-ok  { background: #34a853; font-size: 1.2rem; margin-top: 8px; }
    .btn-reset { background: #9e9e9e; font-size: 0.9rem; }
    #result { text-align: center; font-size: 1rem;
              padding: 14px; border-radius: 8px; margin-top: 10px; display: none; }
    .success { background: #e6f4ea; color: #2d7a3a; }
    .error   { background: #fce8e6; color: #c62828; }
    .loading { background: #e8f0fe; color: #1a73e8; }
    #qr-reader { margin-top: 8px; }
    .stamp-preview { font-size: 1.1rem; font-weight: bold;
                     color: #e65100; text-align: center;
                     padding: 8px; background: #fff3e0;
                     border-radius: 8px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <h1>⚙️ 作業完了登録</h1>

  <div class="card">
    <label>① 管理番号（QRコード読み取り）</label>
    <button class="btn-qr" onclick="startQR()">📷 QRコードを読み取る</button>
    <div id="qr-reader"></div>
    <input type="text" id="kanri" placeholder="管理番号（QR読み取り or 手入力）">
  </div>

  <div class="card">
    <label>② 図面番号（箱紙を撮影）</label>
    <button class="btn-cam"
            onclick="document.getElementById('imgInput').click()">
      🖼️ 箱紙を撮影して図面番号を読み取る
    </button>
    <input type="file" id="imgInput" accept="image/*"
           capture="environment" style="display:none"
           onchange="readOCR(event)">
    <input type="text" id="zuban" placeholder="図面番号（確認・修正できます）">
  </div>

  <div class="card">
    <label>③ 作業者名</label>
    <input type="text" id="sakusya" placeholder="例：内山">
  </div>

  <div class="stamp-preview" id="preview"></div>

  <button class="btn-ok" onclick="kanryou()">✅ 完了登録する</button>
  <button class="btn-reset" onclick="resetForm()">🔄 リセット</button>

  <div id="result"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzAXQasgpjUQPnVtsmqJtM6rJfUwNKMefuWy10GfrMsFw0QuabUp9WyNSvv1lKiVbsqMg/exec";

    document.getElementById("sakusya").addEventListener("input", updatePreview);
    function updatePreview() {
      const sakusya = document.getElementById("sakusya").value.trim();
      const preview = document.getElementById("preview");
      if (sakusya) {
        const now   = new Date();
        const month = String(now.getMonth() + 1).padStart(2, "0");
        const day   = String(now.getDate()).padStart(2, "0");
        preview.style.display = "block";
        preview.textContent   = `📋 登録内容：${month}.${day} ${sakusya}`;
      } else {
        preview.style.display = "none";
      }
    }

    let qrScanner = null;
    function startQR() {
      if (qrScanner) return;
      qrScanner = new Html5Qrcode("qr-reader");
      qrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (text) => {
          document.getElementById("kanri").value = text;
          qrScanner.stop().then(() => { qrScanner = null; });
        }
      );
    }

    async function readOCR(event) {
      const resultDiv = document.getElementById("result");
      resultDiv.className = "loading";
      resultDiv.style.display = "block";
      resultDiv.innerHTML = "🔍 図面番号を読み取り中...";
      const file = event.target.files[0];
      const worker = await Tesseract.createWorker("eng");
      const { data: { text } } = await worker.recognize(file);
      await worker.terminate();
      const match = text.match(/[A-Z][0-9]{2}[A-Z][0-9]{4}[A-Z]{2}[0-9]{4}(=[0-9]+)?/);
      document.getElementById("zuban").value = match ? match[0] : text.trim().split("\n")[0];
      resultDiv.style.display = "none";
    }

    async function kanryou() {
      const kanri   = document.getElementById("kanri").value.trim();
      const zuban   = document.getElementById("zuban").value.trim();
      const sakusya = document.getElementById("sakusya").value.trim();
      const resultDiv = document.getElementById("result");

      if (!zuban || !sakusya) {
        resultDiv.className = "error";
        resultDiv.style.display = "block";
        resultDiv.innerHTML = "⚠️ 図面番号と作業者名を入力してください";
        return;
      }

      resultDiv.className = "loading";
      resultDiv.style.display = "block";
      resultDiv.innerHTML = "📤 送信中...";

      const now   = new Date();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day   = String(now.getDate()).padStart(2, "0");

      try {
        const res  = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ kanri, zuban, sakusya })
        });
        const json = await res.json();

        if (json.status === "ok") {
          resultDiv.className = "success";
          resultDiv.innerHTML =
            `✅ 登録完了！<br>図面番号：${zuban}<br>` +
            `作業者：${sakusya}<br>日時：${month}.${day} ${sakusya}`;
          document.getElementById("kanri").value   = "";
          document.getElementById("zuban").value   = "";
          document.getElementById("sakusya").value = "";
          document.getElementById("preview").style.display = "none";
        } else {
          resultDiv.className = "error";
          resultDiv.innerHTML = `❌ ${json.status}`;
        }
      } catch {
        resultDiv.className = "error";
        resultDiv.innerHTML = "❌ 送信失敗。通信状態を確認してください。";
      }
    }

    function resetForm() {
      document.getElementById("kanri").value   = "";
      document.getElementById("zuban").value   = "";
      document.getElementById("sakusya").value = "";
      document.getElementById("result").style.display = "none";
      document.getElementById("preview").style.display = "none";
      if (qrScanner) { qrScanner.stop(); qrScanner = null; }
      document.getElementById("qr-reader").innerHTML = "";
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
